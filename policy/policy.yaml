version: "2025-08-25.4"

caps:
  default:
    net_read: 5
    net_write: 1
    db_write: 1
    fs_write: 0

qa:
  enabled: false             # << turn off QA gating; telemetry only if enabled
  max_allow_anomaly: 0.25
  block_threshold: 0.85

graph:
  max_runtime_ms: 5000   # soft cap for demo; adjust as needed


timelock:
  default_ttl_seconds: 20
  tools: ["email.send"]   # any call to these tools must go through timelock

tools:
  - name: web.get
    allow: true
    domains_allow:
      - example.com
      - docs.python.org
    rate:
      max_calls: 10
      per_seconds: 60
      cooldown_seconds: 2
    args_schema:
      type: object
      required: ["url"]
      properties:
        url:
          type: string
          format: uri
        headers:
          type: object
          additionalProperties:
            type: string

  - name: email.send
    allow: false            # still disallowed directly (must use timelock)
    rate:
      max_calls: 0
      per_seconds: 60
    args_schema:
      type: object
      required: ["to", "subject", "body"]
      properties:
        to:
          type: string
          format: email
        subject:
          type: string
          maxLength: 200
        body:
          type: string
          maxLength: 5000

  - name: shell.exec
    allow: false
    args_schema:
      type: object
      properties:
        cmd:
          type: string
