version: "2025-08-25.3"

limits:
  max_prompt_len: 4000
  max_urls: 5
  fastpath_max_len: 300

rules:
  block_regex:
    - '(?i)\bignore\s+(?:previous|all)\s+instructions\b'
    - '(?i)\breveal\s+(?:internal|hidden)?\s*system\s+prompt\b'
    - '(?i)\bbypass\s+security\b'
    - '(?i)\bprompt\s*inject(?:ion)?\b'
    - '(?i)\bpretend\s+to\s+be\s+my\s+evil\s+twin\b'
    - '(?i)\bevil\s+twin\b'
    - '(?i)\bdisclose\s+internal\s+polic(y|ies)\b'
    - '(?i)\boverride\s+(?:system|safety|policy)\s+instructions\b'
    - '(?i)\bignore\s+(?:content|safety|policy)\s+(?:rules|guidelines)\b'


  risk_regex:
    - '(?i)api(?:[ _-]?|\s+)key'
    - '(?i)password'
    - '(?i)access[_-]?token'
    - '(?i)secret'
    - '(?i)credential'
  dlp_regex:
    - '\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b'
    - '(?i)\bAKIA[0-9A-Z]{16}\b'
    - '\b(?:\d[ -]*?){13,16}\b'
    - 'AIza[0-9A-Za-z\-_]{30,40}'

